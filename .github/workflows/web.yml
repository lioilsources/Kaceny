# Babylon.js web client (babylon/) → GitHub Pages.
# Site layout: docs/ unchanged at the root (when the folder exists), the game under /play/.
# Requires Settings → Pages → Source: "GitHub Actions" (set by the repo owner, not by this workflow).
name: Web

on:
  push:
    branches: [master]
    paths: ['babylon/**', 'docs/**', 'lib/config/**', 'lib/game/logic/**', 'lib/game/render/**', 'lib/game/skins/**', 'tool/dump_vectors.dart', 'assets/skins/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['babylon/**', 'lib/config/**', 'lib/game/logic/**', 'lib/game/render/**', 'lib/game/skins/**', 'tool/dump_vectors.dart', 'assets/skins/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: Golden vectors in sync with Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.x'
          channel: stable
          cache: true
      - working-directory: .
        run: flutter pub get && dart run tool/dump_vectors.dart
      # Files listed in EXACT have no libm (ints, strings, bools): byte-identical or fail.
      # Files with sin/cos/exp can differ in the last bit between platforms: the TS replay below
      # checks them with a 1e-9 tolerance instead.
      - name: Discrete vectors equal the committed ones
        run: git diff --exit-code --stat babylon/test/golden babylon/src/rules/generated
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: babylon/package-lock.json
      - name: TS port replays the freshly generated vectors
        working-directory: babylon
        run: npm ci && npx vitest run test/golden.test.ts

  gate:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: babylon
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: babylon/package-lock.json
      - run: npm ci
      - run: npm run gate
      - name: Assemble site (docs/ at root, game under /play/)
        working-directory: .
        run: |
          mkdir -p _site
          if [ -d docs ]; then cp -R docs/. _site/; fi
          mkdir -p _site/play
          cp -R babylon/dist/. _site/play/
          touch _site/.nojekyll
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [golden, gate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}play/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
