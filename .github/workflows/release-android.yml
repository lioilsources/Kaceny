name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Bump build number
        run: |
          # Version comes from the release tag (v2.2.3 → 2.2.3); pubspec is only a fallback.
          BASE="${GITHUB_REF_NAME#v}"
          echo "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || BASE=$(grep '^version:' pubspec.yaml | sed -E 's/^version: ([0-9.]+).*/\1/')
          NEW="${BASE}+${{ github.run_number }}"
          sed -i -E "s/^version: .*/version: ${NEW}/" pubspec.yaml
          echo "Build version: ${NEW}"

      - name: Create keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo -n "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > android/app/release.keystore
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n" "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK signing certificate
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          echo "=== APK signing certificate ==="
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -20

      - name: Keep AAB as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaceny-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          name: Kaceny ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true

      # Testers install from Firebase, where Play Billing never works, so the
      # APK they get unlocks every skin. Built after the GitHub upload: it
      # overwrites app-release.apk, and the public APK must stay gated.
      - name: Build tester APK (all skins unlocked)
        run: flutter build apk --release --dart-define=TESTER_UNLOCK=true

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: Alfa
          releaseNotes: "Kaceny ${{ github.ref_name }} (build ${{ github.run_number }})"
          file: build/app/outputs/flutter-apk/app-release.apk
