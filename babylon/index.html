<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7EC8F0">
  <meta name="description" content="Kačeny — sestřel kachny z nebe za 90 sekund. Hraj v prohlížeči.">
  <title>Kačeny</title>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="fx"></canvas>
  <div id="top" class="hud">
    <span id="time" class="pill">1:30</span>
    <span><span id="mult"></span><span id="score" class="pill">0</span></span>
  </div>
  <div id="belt" class="hud"><div class="shells"></div><div id="reload" hidden></div></div>
  <div id="over" hidden>
    <div>Konec kola</div>
    <div id="over-score">0</div>
    <div id="over-stats"></div>
    <button id="again">Znovu</button>
  </div>
  <div id="fps" class="hud" hidden></div>
  <script type="module" src="/src/game/main.ts"></script>
</body>
</html>
